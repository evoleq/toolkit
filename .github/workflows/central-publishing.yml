name: Maven Central publishing

# Deliberate authorization: DNS verification, license and Portal credentials
# are human-controlled prerequisites. Called directly by SemVer or manually.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      deployment_id:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing CI-verified annotated release tag (vX.Y.Z)"
        type: string
        required: true
      deployment_id:
        description: 'Existing Portal deployment UUID for recovery; leave empty for new upload'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: central-staging-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release evidence before using secrets
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      existing: ${{ steps.release.outputs.existing }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag, compatibility and master CI provenance
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          CENTRAL_LICENSE_NAME: ${{ vars.CENTRAL_LICENSE_NAME }}
          CENTRAL_LICENSE_URL: ${{ vars.CENTRAL_LICENSE_URL }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected stable annotated tag vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ -z "$CENTRAL_LICENSE_NAME" || "$CENTRAL_LICENSE_URL" != https://* ]]; then
            echo "Set actual distribution license via CENTRAL_LICENSE_NAME and CENTRAL_LICENSE_URL variables." >&2
            exit 1
          fi
          git fetch origin master --tags
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"
          SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          export SHA
          git merge-base --is-ancestor "$SHA" "refs/remotes/origin/master"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$SHA&status=success&per_page=100" |
            python -c 'import json, os, sys; runs=json.load(sys.stdin)["workflow_runs"]; assert any(r["head_sha"] == os.environ["SHA"] and r["head_branch"] == "master" and r["conclusion"] == "success" for r in runs), "No successful master push CI at this exact commit"'
          git checkout --detach "$SHA"
          python -m unittest discover -s scripts/tests -v
          python scripts/release.py validate
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          gh release view "$TAG" --json assets > /tmp/release-assets.json
          echo "existing=$(jq -r --arg name "$TAG-central-deployment.json" 'any(.assets[]; .name == $name)' /tmp/release-assets.json)" >> "$GITHUB_OUTPUT"

  stage:
    name: Build and sign ${{ matrix.host }} publications
    needs: verify
    if: ${{ inputs.deployment_id == '' && needs.verify.outputs.existing == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux
            os: ubuntu-latest
          - host: macos
            os: macos-15
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Prepare Android SDK on Linux
        if: matrix.host == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > /dev/null || true
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"
      - name: Stage exactly this host's publications with PGP signatures
        shell: bash
        env:
          CENTRAL_PUBLISHING: 'true'
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          CENTRAL_LICENSE_NAME: ${{ vars.CENTRAL_LICENSE_NAME }}
          CENTRAL_LICENSE_URL: ${{ vars.CENTRAL_LICENSE_URL }}
          CENTRAL_SIGNING_KEY: ${{ secrets.CENTRAL_SIGNING_KEY }}
          CENTRAL_SIGNING_PASSWORD: ${{ secrets.CENTRAL_SIGNING_PASSWORD }}
          HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          read -r -a TASKS <<< "$(python scripts/central_publication_tasks.py "$HOST")"
          gradle --no-daemon "${TASKS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: central-${{ matrix.host }}
          path: build/central-staging/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Validate complete bundle and upload automatically
    needs: [verify, stage]
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: central-*
          path: build/central-staging/
          merge-multiple: true
      - name: Import signing key for offline signature verification
        shell: bash
        env:
          CENTRAL_SIGNING_KEY: ${{ secrets.CENTRAL_SIGNING_KEY }}
        run: |
          set -euo pipefail
          : "${CENTRAL_SIGNING_KEY:?Missing Central signing key}"
          printf '%s\n' "$CENTRAL_SIGNING_KEY" | gpg --batch --import
      - name: Verify manifest, POM coordinates, PGP signatures and platform completeness
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python scripts/central_bundle.py bundle --version "$RELEASE_VERSION" --verify-pgp
          unzip -t build/release/central-bundle.zip > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-central-bundle-${{ inputs.tag }}
          path: build/release/central-bundle.zip
          retention-days: 14
      - name: Upload to Sonatype Central Portal (AUTOMATIC)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          : "${CENTRAL_USERNAME:?Missing Sonatype Portal token username}"
          : "${CENTRAL_PASSWORD:?Missing Sonatype Portal token password}"
          # Do not re-upload immutable versions already present on Central.
          python scripts/central_release.py guard "$RELEASE_VERSION"
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 | tr -d '\r\n')"
          DEPLOYMENT_ID="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $AUTH" \
            --form "bundle=@build/release/central-bundle.zip;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=toolkit-$RELEASE_VERSION")"
          echo "Central Portal deployment ID: $DEPLOYMENT_ID"
          python scripts/central_release.py receipt "$DEPLOYMENT_ID" "$TAG" "${{ needs.verify.outputs.sha }}"
          gh release upload "$TAG" "$TAG-central-deployment.json"

  confirm:
    name: Confirm Portal publication and remote consumer
    needs: [verify, stage, deploy]
    if: ${{ always() && needs.verify.result == 'success' && (needs.deploy.result == 'success' || (needs.stage.result == 'skipped' && needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Resolve deployment receipt and await PUBLISHED
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOYMENT_ID" ]]; then
            gh release download "$TAG" --pattern "$TAG-central-deployment.json"
            DEPLOYMENT_ID="$(jq -er .deploymentId "$TAG-central-deployment.json")"
          fi
          python scripts/central_release.py wait "$DEPLOYMENT_ID" "$TAG" "$RELEASE_SHA"
      - name: Resolve every module from Central and compile independent consumer
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/central_release.py remote "$VERSION"
          gradle --no-daemon --refresh-dependencies -p central-publishing-smoke -PcentralRemote=true -PtoolkitVersion="$VERSION" compileKotlin verifyAllModules
      - name: Attach verified publishing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python scripts/central_release.py complete "$TAG"
          gh release upload "$TAG" "$TAG-central-publication.json" --clobber
