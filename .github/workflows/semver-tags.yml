name: SemVer tags

# Version only successful, tested master pushes; never PRs or docs-only changes.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: semver-tags-master
  cancel-in-progress: false

jobs:
  tag:
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate release contracts and create compatibility record
        id: release
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags
          if [[ "$(git rev-parse origin/master)" != "$TESTED_SHA" ]]; then
            echo "Newer master commit exists; do not tag stale CI results."
            exit 0
          fi

          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/release.py validate
          python3 scripts/release.py plan --output build/release-plan.json
          next="$(python3 -c 'import json; print(json.load(open("build/release-plan.json"))["nextTag"] or "")')"
          if [[ -z "$next" ]]; then
            echo "No package-relevant changes: no release tag."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "Tag $next exists; refusing to overwrite it."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" "$TESTED_SHA" -m "ToolKit $next (CI verified)"
          git push origin "refs/tags/$next"

          python3 scripts/release.py record \
            --plan build/release-plan.json --ci-run "$CI_RUN" \
            --output "build/$next-compatibility.json"
          gh release create "$next" "build/$next-compatibility.json" \
            --title "ToolKit $next" \
            --notes "CI-verified source release. See the attached compatibility record for exact module versions and evidence. Maven Central publication is tracked separately; a source release does not prove artifact availability."
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Tagged $next at $TESTED_SHA and attached compatibility record."

  publish-central:
    needs: tag
    if: ${{ needs.tag.outputs.tag != '' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/central-publishing.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
